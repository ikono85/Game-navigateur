<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowGate Arena</title>

    <!-- Polices de l'écran de sélection de classe (Cinzel + Cinzel Decorative) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&display=swap"
    />

    <!--
      Filet de sécurité pour GitHub Pages.

      Si Pages sert le dépôt tel quel (mode « Deploy from a branch ») au lieu du
      build Vite, le navigateur charge directement ./src/main.js. Il bute alors
      sur `import Phaser from 'phaser'`, un import par nom qu'il ne sait pas
      résoudre — d'où la page blanche. Cette import map lui donne la réponse.

      Elle est sans effet dans les deux cas normaux : en dev, Vite réécrit
      l'import avant que le navigateur ne la consulte ; dans le build de
      production, Phaser est déjà inclus dans le bundle.

      esm.sh et non le fichier phaser.esm.js officiel : ce dernier n'expose que
      des exports nommés, alors que le code fait `import Phaser from 'phaser'`.
    -->
    <script type="importmap">
      {
        "imports": {
          "phaser": "https://esm.sh/phaser@3.80.1"
        }
      }
    </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #e8e0d0;
      }
      #game { width: 100vw; height: 100vh; }
      #game canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- chemin relatif : le site est servi depuis un sous-dossier -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
